<!doctype html>
<html lang="th"><head><meta charset="utf-8"><title>Class Tab — 3 Layouts</title>
<style>
@font-face { font-family: Kanit; src: url(/assets/fonts/Kanit-Medium.ttf); font-weight: 500; }
@font-face { font-family: Kanit; src: url(/assets/fonts/Kanit-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: Noto; src: url(/assets/fonts/NotoSansThai.ttf); }
@page { size: A4 landscape; margin: 8mm; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Segoe UI", Noto, sans-serif; color: #222; }
.page { page-break-after: always; padding: 1mm; }
h1 { font: 600 22px Kanit; margin: 0 0 2px; } h2 { font: 600 17px Kanit; margin: 0 0 3px; }
p, li { font-size: 11.5px; line-height: 1.45; margin: 2px 0; } .pro { color: #1a7a3a; } .con { color: #b03030; }
/* ---- game window mock ---- */
.scr { position: relative; width: 1000px; height: 560px; margin: 4px auto; overflow: hidden; border-radius: 4px; color: #ece4d2;
  font-family: "Segoe UI", Noto, sans-serif; background: #07060a; }
.scr .bgimg { position: absolute; inset: -10px; background: url(/assets/ui/title/bg.png) center 30% / cover; filter: blur(5px) brightness(0.25); }
.head { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; gap: 22px; padding: 0 16px; border-bottom: 1px solid rgba(236,228,210,.25); background: rgba(6,6,10,.85); font: 500 12px Kanit; color: #a69e8d; z-index: 2; }
.head .on { color: #fff; border-bottom: 2px solid #e8d7a5; padding-bottom: 6px; margin-top: 8px; }
.body { position: absolute; left: 0; right: 0; top: 40px; bottom: 0; }
.k { font: 500 9px Kanit; letter-spacing: 2px; color: #a69e8d; text-transform: uppercase; }
.name { font: 600 18px Kanit; letter-spacing: 2px; text-transform: uppercase; }
.badge { display: inline-block; font: 600 8.5px Kanit; letter-spacing: 1px; padding: 1px 6px; border-radius: 2px; vertical-align: middle; }
.b-cur { background: #e8c070; color: #1a1206; } .b-lock { background: rgba(255,255,255,.1); color: #bbb; } .b-ready { background: #b060ff; color: #fff; box-shadow: 0 0 8px #b060ff; } .b-open { background: #4caf7a; color: #fff; }
.bar { height: 5px; background: rgba(255,255,255,.1); border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg,#8a5a20,#e8c070); }
.req { display: flex; align-items: center; gap: 8px; font-size: 11px; margin: 4px 0; } .req .bar { flex: 1; } .req .ok { color: #8fe0a0; }
.btn { display: inline-block; font: 600 12px Kanit; letter-spacing: 1px; padding: 7px 16px; border: 1px solid var(--cc, #e8d7a5); background: rgba(232,215,165,.12); border-radius: 3px; color: #fff; }
.rates { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 10px; color: #a69e8d; }
.rates div { display: flex; align-items: center; gap: 6px; } .rates span { width: 48px; } .rates i { white-space: nowrap; } .rates b { display: inline-block; width: 7px; height: 4px; margin-right: 2px; background: rgba(255,255,255,.12); } .rates b.on { background: var(--cc); }
.skills { display: flex; gap: 4px; } .skills img { width: 30px; height: 30px; border: 1px solid rgba(236,228,210,.2); border-radius: 3px; }
.chips span { display: inline-block; font-size: 10px; border: 1px solid rgba(236,228,210,.2); border-radius: 10px; padding: 1px 8px; margin: 2px 3px 0 0; color: #cfc7b4; } .chips b { color: #fff; }
.panel { background: rgba(6,6,10,.72); border: 1px solid rgba(236,228,210,.14); border-radius: 3px; padding: 10px 12px; }
.sw { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 10px; color: #cfc7b4; } .sw b { display: block; font: 600 9px Kanit; letter-spacing: 1px; margin-bottom: 2px; }
.lab { position: absolute; background: #f2d34b; color: #000; font: 600 10px Kanit; padding: 1px 6px; border-radius: 3px; z-index: 5; }
</style></head><body>
<script>
const C = {
  aegis_guardian: { n: 'Aegis Guardian', c: '#ffd070', role: 'Tank · Protector · Crowd Control', q: 'Stand in front. Take the blow. Answer it.', st: 'cur', r: [3, 2, 5, 2, 2], sk: ['ag_sk1','ag_sk2','ag_sk3','ag_sk4','ag_sk7'] },
  warden_of_dawn: { n: 'Warden of Dawn', c: '#8ad0ff', role: 'Support Tank · Barrier', q: 'Until the light fades, this shield will not break.', st: 'lock', p: [1, 3], r: [3, 2, 5, 2, 2], sk: ['dw_sk1','dw_sk2','dw_sk3','dw_sk4','dw_sk7'] },
  bulwark_sentinel: { n: 'Bulwark Sentinel', c: '#f0c850', role: 'Main Tank · Mitigation', q: 'This wall never retreats.', st: 'lock', p: [1, 3], r: [2, 2, 5, 1, 1], sk: ['bs_sk1','bs_sk2','bs_sk3','bs_sk4','bs_sk7'] },
  oathbreaker: { n: 'Oathbreaker', c: '#b060ff', role: 'Counter Tank · Aggro DPS · Bruiser', q: 'The more you hurt me, the more it will hurt you.', st: 'ready', p: [2, 2], r: [5, 4, 3, 2, 2], sk: ['ok_sk1','ok_sk2','ok_sk3','ok_sk4','ok_sk7'] },
};
const KIDS = ['warden_of_dawn', 'bulwark_sentinel', 'oathbreaker'];
const emb = (id) => `/assets/ui/class/${id}_emblem.png`, spl = (id) => `/assets/ui/class/${id}_splash.png`;
const badge = (s) => ({ cur: '<span class="badge b-cur">CURRENT</span>', lock: '<span class="badge b-lock">🔒 LOCKED</span>', ready: '<span class="badge b-ready">TRIAL READY</span>', open: '<span class="badge b-open">UNLOCKED</span>' })[s];
const rates = (id) => `<div class="rates" style="--cc:${C[id].c}">${['Difficulty','Damage','Defense','Range','Mobility'].map((l, i) => `<div><span>${l}</span><i>${[1,2,3,4,5].map((k) => `<b class="${k <= C[id].r[i] ? 'on' : ''}"></b>`).join('')}</i></div>`).join('')}</div>`;
const skills = (id) => `<div class="skills">${C[id].sk.map((s) => `<img src="/assets/icons/${s}.png" onerror="this.style.opacity=.15">`).join('')}</div>`;
const path = (id) => `<div class="k" style="color:${C[id].c}">Path to ${C[id].n}</div>
  <div class="req"><span class="ok">✓</span>Reach LV 30</div>
  <div class="req"><span class="ok">✓</span>Judgments ×15 <div class="bar"><i style="width:100%"></i></div><span>15/15</span></div>
  <div class="req">○ Trial of the Broken Oath</div>
  <span class="btn" style="--cc:${C[id].c}">Begin Trial</span>`;
const chips = `<div class="chips"><span>Attacks blocked <b>148</b></span><span>Perfect guards <b>32</b></span><span>Taunts <b>61</b></span><span>Judgments <b>15</b></span></div>`;
const head = `<div class="head"><span>Equipment</span><span>Skills</span><span class="on">Class</span><span>Codex</span><span>Quests</span></div>`;
const sel = 'oathbreaker';
function page(title, html, notes) { document.write(`<div class="page">${title}<div class="scr"><div class="bgimg"></div>${head}<div class="body">${html}</div></div>${notes}</div>`); }
</script>

<script>
document.write(`<div class="page"><h1>หน้า Class (หน้าต่างตัวละคร) — 3 แบบให้เลือก</h1>
<p>ม็อกอัปใช้ภาพตัวละคร ตราคลาส และไอคอนสกิลจริงของเกม · ตัวอย่าง = สาย Aegis ตอนผู้เล่นเป็น Aegis Guardian, Oathbreaker ถึงขั้น TRIAL READY, อีกสองคลาสยังล็อก · คลาสที่เลือกดูอยู่ = Oathbreaker</p>
<p>ทุกแบบมีเหมือนกัน: สถานะ <b>CURRENT / UNLOCKED / TRIAL READY / LOCKED</b>, เงื่อนไขพร้อมแถบความคืบหน้า, ปุ่ม Begin Trial / Change Class, ข้อมูลคลาส (บทบาท คำคม ดาว สกิล), Class Records เป็นชิป · ใช้ได้ทุกคลาสอัตโนมัติจากข้อมูล ไม่ต้องทำรูปเพิ่ม</p></div>`);

// ===== A
page('<h2>แบบ A — "ทรีแนวตั้ง + ภาพใหญ่" (เข้าชุดกับหน้าเลือกคลาส)</h2>', `
  <img src="${spl(sel)}" style="position:absolute;right:20px;bottom:0;height:500px;filter:drop-shadow(0 0 24px ${C[sel].c}88)">
  <div style="position:absolute;left:0;top:16px;width:420px">
    <div style="display:flex;align-items:center;gap:12px;padding:8px 0 8px 20px;background:linear-gradient(90deg,rgba(150,120,70,.55),transparent);border-top:1px solid rgba(232,215,165,.4);border-bottom:1px solid rgba(232,215,165,.4)">
      <img src="${emb('aegis_guardian')}" style="width:64px"><div><div class="k" style="color:#e8dcc0">Base class</div><div class="name">Aegis Guardian ${badge('cur')}</div></div></div>
    <div style="position:relative;padding:6px 0 0 34px">
      <div style="position:absolute;left:52px;top:0;bottom:24px;width:1px;background:rgba(232,215,165,.4)"></div>
      ${KIDS.map((id) => `<div style="display:flex;align-items:center;gap:10px;margin:6px 0;${id === sel ? 'background:rgba(176,96,255,.12);' : ''}padding:3px 6px;border-radius:3px"><img src="${emb(id)}" style="width:40px;${C[id].st === 'lock' ? 'filter:brightness(.6) saturate(.6)' : `filter:drop-shadow(0 0 6px ${C[id].c})`}">
        <div style="flex:1"><div class="k" style="color:#c9a96a">Class 2</div><div class="name" style="font-size:14px;color:${id === sel ? C[id].c : '#ece4d2'}">${C[id].n} ${badge(C[id].st)}</div>
        <div class="bar" style="width:160px;margin-top:3px"><i style="width:${(C[id].p[0] / 3) * 100}%"></i></div></div></div>`).join('')}
    </div>
    <div class="panel" style="margin:6px 0 0 20px;width:380px">${path(sel)}</div>
  </div>
  <div class="panel" style="position:absolute;left:440px;top:16px;width:270px;--cc:${C[sel].c};border-left:2px solid ${C[sel].c}">
    <div class="k" style="color:${C[sel].c}">${C[sel].role}</div><p style="font-style:italic;color:#e8e0f0">“${C[sel].q}”</p>
    ${rates(sel)}<div style="margin-top:6px">${skills(sel)}</div>
    <div class="sw" style="margin-top:6px"><div><b style="color:#8fe0a0">STRENGTHS</b>+ Huge counter damage<br>+ Pulls aggro</div><div><b style="color:#ff8a8a">WEAKNESSES</b>− Takes heavy damage<br>− Risky timing</div></div>
  </div>
  <div style="position:absolute;left:20px;bottom:10px;width:690px"><div class="k">Class records · Aegis Guardian</div>${chips}</div>`,
  `<p><span class="pro">ข้อดี:</span> เหมือนหน้าเลือกคลาส ผู้เล่นเห็นแบบเดียวกันตั้งแต่สร้างตัวละคร · เงื่อนไขกับปุ่ม Trial อยู่ใต้ทรีทันที · ภาพใหญ่ทำให้อยากปลดคลาส &nbsp; <span class="con">ข้อเสีย:</span> กล่องข้อมูลกลางจอแคบ ข้อความยาวต้องย่อ</p>`);

// ===== B
page('<h2>แบบ B — "การ์ดคลาส 2 เรียงแถว" (สไตล์การ์ดอัปเกรด)</h2>', `
  <div style="position:absolute;left:20px;top:14px;width:250px;bottom:14px" class="panel">
    <img src="${spl('aegis_guardian')}" style="display:block;height:300px;margin:0 auto;filter:drop-shadow(0 0 14px #ffd07077)">
    <div class="k" style="margin-top:4px;color:#e8dcc0">Base class</div><div class="name">Aegis Guardian</div>${badge('cur')}
    <div style="margin-top:8px" class="k">Class records</div>${chips}
  </div>
  <div style="position:absolute;left:285px;top:14px;right:20px;height:285px;display:flex;gap:10px">
    ${KIDS.map((id) => `<div style="flex:1;position:relative;border:1px solid ${id === sel ? C[id].c : 'rgba(236,228,210,.16)'};border-radius:4px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%, ${C[id].c}33, rgba(6,6,10,.9) 70%);${id === sel ? `box-shadow:0 0 14px ${C[id].c}88` : ''}">
      <img src="${spl(id)}" style="position:absolute;left:50%;bottom:52px;transform:translateX(-50%);height:220px;${C[id].st === 'lock' ? 'filter:brightness(.4) grayscale(.6)' : ''}">
      <div style="position:absolute;top:6px;right:6px">${badge(C[id].st)}</div>
      <div style="position:absolute;left:0;right:0;bottom:0;padding:6px 10px;background:rgba(6,6,10,.85);display:flex;align-items:center;gap:8px"><img src="${emb(id)}" style="width:30px"><div style="flex:1"><div class="name" style="font-size:13px;color:${C[id].c}">${C[id].n}</div><div class="bar" style="margin-top:3px"><i style="width:${(C[id].p[0] / 3) * 100}%"></i></div></div></div>
    </div>`).join('')}
  </div>
  <div class="panel" style="position:absolute;left:285px;top:312px;width:330px;bottom:14px;border-left:2px solid ${C[sel].c};--cc:${C[sel].c}">
    <div class="k" style="color:${C[sel].c}">${C[sel].role}</div><p style="font-style:italic">“${C[sel].q}”</p>${rates(sel)}<div style="margin-top:6px">${skills(sel)}</div>
    <div class="sw" style="margin-top:6px"><div><b style="color:#8fe0a0">STRENGTHS</b>+ Huge counter damage<br>+ Pulls aggro</div><div><b style="color:#ff8a8a">WEAKNESSES</b>− Takes heavy damage<br>− Risky timing</div></div></div>
  <div class="panel" style="position:absolute;left:628px;top:312px;right:20px;bottom:14px">${path(sel)}</div>`,
  `<p><span class="pro">ข้อดี:</span> เห็นคลาส 2 ทั้งสามพร้อมกันเป็นการ์ดภาพ เปรียบเทียบง่าย สะดุดตา (คล้ายรูปการ์ดอัปเกรดที่คุณส่งมา) · คลาสที่ล็อกดูมืด ปลดแล้วสว่าง &nbsp; <span class="con">ข้อเสีย:</span> ภาพในการ์ดเล็กลง · ถ้าอนาคตมีคลาส 3 หรือคลาสลับเพิ่ม การ์ดจะแน่น</p>`);

// ===== C
page('<h2>แบบ C — "เส้นทางแตกกิ่งกลางจอ" (ทรีแนวนอน + รายละเอียดด้านขวา)</h2>', `
  <svg style="position:absolute;left:0;top:0" width="560" height="520">${KIDS.map((id, i) => `<path d="M150,250 C260,250 260,${110 + i * 140} 360,${110 + i * 140}" fill="none" stroke="${C[id].st === 'lock' ? 'rgba(236,228,210,.2)' : C[id].c}" stroke-width="2.5" ${C[id].st === 'lock' ? 'stroke-dasharray="6 5"' : ''}/>`).join('')}</svg>
  <div style="position:absolute;left:40px;top:180px;text-align:center;width:150px"><img src="${emb('aegis_guardian')}" style="width:110px;filter:drop-shadow(0 0 12px #ffd07099)"><div class="name" style="font-size:14px">Aegis Guardian</div>${badge('cur')}</div>
  ${KIDS.map((id, i) => `<div style="position:absolute;left:340px;top:${70 + i * 140}px;display:flex;align-items:center;gap:10px;width:230px;padding:6px;border-radius:4px;${id === sel ? `background:${C[id].c}22;border:1px solid ${C[id].c}` : 'border:1px solid transparent'}">
    <div style="position:relative;width:64px;height:64px"><svg width="64" height="64" style="position:absolute;inset:0"><circle cx="32" cy="32" r="30" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/><circle cx="32" cy="32" r="30" fill="none" stroke="${C[id].c}" stroke-width="3" stroke-dasharray="${(C[id].p[0] / 3) * 188} 188" transform="rotate(-90 32 32)"/></svg><img src="${emb(id)}" style="position:absolute;inset:8px;width:48px;${C[id].st === 'lock' ? 'filter:brightness(.6) saturate(.5)' : ''}"></div>
    <div><div class="name" style="font-size:13px;color:${C[id].c}">${C[id].n}</div>${badge(C[id].st)}<div style="font-size:9px;color:#a69e8d;margin-top:2px">${C[id].p[0]}/3 requirements</div></div></div>`).join('')}
  <div style="position:absolute;right:0;top:0;bottom:0;width:410px;background:linear-gradient(90deg,transparent,rgba(6,6,10,.85) 18%)">
    <img src="${spl(sel)}" style="position:absolute;right:160px;bottom:150px;height:330px;opacity:.95;filter:drop-shadow(0 0 18px ${C[sel].c}88)">
    <div style="position:absolute;right:16px;top:16px;width:200px;--cc:${C[sel].c}"><div class="k" style="color:${C[sel].c}">${C[sel].role}</div><div class="name" style="font-size:16px">${C[sel].n}</div><p style="font-style:italic;font-size:10.5px">“${C[sel].q}”</p>${rates(sel)}<div style="margin-top:6px">${skills(sel)}</div></div>
    <div class="panel" style="position:absolute;left:70px;right:16px;bottom:14px">${path(sel)}</div>
  </div>
  <div style="position:absolute;left:20px;bottom:10px;width:520px"><div class="k">Class records · Aegis Guardian</div>${chips}</div>`,
  `<p><span class="pro">ข้อดี:</span> ดูเป็น "เส้นทางการเติบโต" ชัดที่สุด วงแหวนรอบตราบอกความคืบหน้าในพริบตา · เส้นทึบ = เดินได้ เส้นประ = ยังล็อก · ขยายเป็นคลาส 3 ได้ง่าย (ต่อกิ่งไปทางขวา) &nbsp; <span class="con">ข้อเสีย:</span> ภาพตัวละครเล็กกว่าแบบ A · พื้นที่กลางจอว่างเยอะเมื่อมีแค่ 3 กิ่ง</p>`);

document.write(`<div class="page"><h2>สรุป</h2><table style="border-collapse:collapse;width:100%;font-size:12px">
<tr><th style="border:1px solid #bbb;padding:5px;background:#eee"></th><th style="border:1px solid #bbb;padding:5px;background:#eee">A ทรีแนวตั้ง + ภาพใหญ่</th><th style="border:1px solid #bbb;padding:5px;background:#eee">B การ์ดเรียงแถว</th><th style="border:1px solid #bbb;padding:5px;background:#eee">C เส้นทางแตกกิ่ง</th></tr>
${[['เข้าชุดกับหน้าเลือกคลาส', 'มากที่สุด', 'ปานกลาง', 'ปานกลาง'], ['เปรียบเทียบคลาส 2 ทั้งสาม', 'ต้องกดทีละอัน', 'ดีที่สุด (เห็นพร้อมกัน)', 'ดี'], ['ภาพตัวละคร', 'ใหญ่ที่สุด', 'การ์ดละรูป (เล็ก)', 'กลาง'], ['บอกความคืบหน้า', 'แถบใต้ชื่อ', 'แถบในการ์ด', 'วงแหวนรอบตรา (ชัดสุด)'], ['รองรับคลาส 3 / คลาสลับในอนาคต', 'ดี (ต่อลงด้านล่าง)', 'แน่น', 'ดีที่สุด (ต่อกิ่งขวา)']].map((r) => `<tr>${r.map((c, i) => `<td style="border:1px solid #bbb;padding:5px;${i ? '' : 'font-weight:600'}">${c}</td>`).join('')}</tr>`).join('')}
</table><p style="margin-top:8px"><b>คำแนะนำ:</b> <b>A</b> ถ้าอยากให้ทั้งเกมเป็นภาษาเดียวกัน (หน้าเลือกคลาส = หน้า Class) · <b>B</b> ถ้าอยากให้ "อยากปลด" ที่สุดด้วยการ์ดภาพสามใบ · ผสมได้ เช่น ทรีของ A + วงแหวนความคืบหน้าของ C</p></div>`);
</script>
</body></html>
